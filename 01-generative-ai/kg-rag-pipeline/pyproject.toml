[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-rag-pipeline"
version = "0.1.0"
description = "Knowledge Graph–augmented RAG with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ikram Khan", email = "ikram@ikramkhan.de" }]

dependencies = [
    # LLM / RAG
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "openai>=1.30",

    # Knowledge Graph
    "neo4j>=5.20",
    "SPARQLWrapper>=2.0",

    # Vector store
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",

    # NLP
    "spacy>=3.7",
    "gliner>=0.2",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Utilities
    "tenacity>=8.3",
    "structlog>=24.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
