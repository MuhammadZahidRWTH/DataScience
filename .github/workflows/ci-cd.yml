name: CI - Fraud Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost mlflow fastapi uvicorn pydantic joblib evidently pytest pytest-cov httpx2 flake8

      - name: lint
        run: |
          flake8 03-mlops/fraud-detection/ --max-line-length=100 --extend-ignore=E501,W503,E221,W291,W293,W292,E302,E303,E305,F401,E701,E272

      - name: generate data and run tests
        run: |
          cd 03-mlops/fraud-detection
          python data/generate_data.py
          pytest tests/ -v

  train:
    name: Train and Evaluate
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost mlflow joblib

      - name: train and evaluate
        run: |
          cd 03-mlops/fraud-detection
          python data/generate_data.py
          python model/train.py
          python -c "
          import json
          with open('model/metadata.json') as f:
              meta = json.load(f)
          roc_auc = meta['metrics']['roc_auc']
          print(f'ROC-AUC: {roc_auc}')
          assert roc_auc >= 0.85, f'ROC-AUC {roc_auc} below threshold 0.85'
          print('performance gate passed')
          "

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-model
          path: 03-mlops/fraud-detection/model/
          retention-days: 7
