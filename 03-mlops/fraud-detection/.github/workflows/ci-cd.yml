name: CI — Fraud Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 03-mlops/fraud-detection

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost mlflow fastapi uvicorn pydantic joblib evidently pytest pytest-cov httpx2 flake8

      - name: lint with flake8
        run: |
          flake8 . --max-line-length=100 --exclude=zahid,mlruns,.git,__pycache__,mlflow.db --extend-ignore=E501,W503

    - name: generate data
        run: python data/generate_data.py
        working-directory: 03-mlops/fraud-detection

      - name: run tests
        run: pytest tests/ -v
        working-directory: 03-mlops/fraud-detection

  train:
    name: Train & Evaluate
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: 03-mlops/fraud-detection

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost mlflow joblib

      - name: generate data
        run: python data/generate_data.py

      - name: train model
        run: python model/train.py

      - name: performance gate
        run: |
          python -c "
          import json
          with open('model/metadata.json') as f:
              meta = json.load(f)
          roc_auc = meta['metrics']['roc_auc']
          print(f'ROC-AUC: {roc_auc}')
          assert roc_auc >= 0.85, f'ROC-AUC {roc_auc} below threshold 0.85'
          print('performance gate passed')
          "

      - name: upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-model
          path: 03-mlops/fraud-detection/model/
          retention-days: 7
